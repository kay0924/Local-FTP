# Front door for FileBrowser (container "filebrowser" on the compose network).
#  - adds the "Folder access" section to Settings > User Management (branding/img/fb-folders.js)
#  - makes browsers always re-check the theme/script files (FileBrowser itself says "cache 1 day",
#    even for "not found" answers)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    listen [::]:8080;
    client_max_body_size 0;

    # re-resolve the FileBrowser container if it is recreated
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fb http://filebrowser:80;

    location ~ ^/static/(custom\.css$|img/) {
        proxy_pass $fb;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        proxy_pass $fb;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        proxy_set_header Accept-Encoding "";
        sub_filter_once on;
        sub_filter '</body>' '<script src="/static/img/fb-folders.js?v=2"></script></body>';
    }
}
